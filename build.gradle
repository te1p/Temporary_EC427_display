plugins {
	id 'com.adarshr.test-logger' version '4.0.0' apply false
	id "com.diffplug.spotless" version "7.0.0.BETA1" apply false
}

// Everything in this block applies to every module (subproject) in the project. Each
// module gets its own build.gradle for configuration specific to that module - like
// its runService task or a dependency on a shared library module.
subprojects {
	apply plugin: 'java'
	apply plugin: 'com.adarshr.test-logger'
	apply plugin: 'pmd'
	apply plugin: 'com.diffplug.spotless'

	group = 'edu.bu'
	version = '1.0-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencies {
		testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
		testImplementation 'org.mockito:mockito-core:5.12.0'
		testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
		// Gradle 9 no longer puts the JUnit Platform launcher on the test classpath automatically.
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.1'
		implementation 'io.finnhub:kotlin-client:2.0.20'
		// The Finnhub client is written in Kotlin, so its standard library has to be on our
		// runtime classpath. There is no Kotlin source in this project, so we declare the
		// stdlib as an ordinary dependency rather than applying the Kotlin plugin.
		implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
		implementation 'org.java-websocket:Java-WebSocket:1.5.6'
		implementation 'com.googlecode.json-simple:json-simple:1.1.1'
		implementation 'com.google.guava:guava:33.2.1-jre'
		pmd 'net.sourceforge.pmd:pmd-ant:7.0.0'
		pmd 'net.sourceforge.pmd:pmd-java:7.0.0'
		implementation 'org.tinylog:tinylog-api:2.6.2'
		implementation 'org.tinylog:tinylog-impl:2.6.2'
	}

	pmd {
		consoleOutput = true
		toolVersion = "7.0.0"

		pmdMain {
			rulesMinimumPriority = 4
			ruleSets = [
					"category/java/performance.xml/AvoidArrayLoops",
					"category/java/design.xml/AvoidDeeplyNestedIfStmts",
					"category/java/design.xml/CollapsibleIfStatements",
					"category/java/design.xml/CognitiveComplexity",
					"category/java/design.xml/CyclomaticComplexity",
					"category/java/bestpractices.xml/UnusedLocalVariable",
					"category/java/codestyle.xml/ShortVariable",
					"category/java/codestyle.xml/UseDiamondOperator",
					"category/java/errorprone.xml/BrokenNullCheck",
					"category/java/errorprone.xml/CloseResource",
					"category/java/errorprone.xml/CompareObjectsWithEquals",
					"category/java/errorprone.xml/ReturnEmptyCollectionRatherThanNull",
					"category/java/performance.xml/AvoidArrayLoops"
			]
		}

		pmdTest {
			rulesMinimumPriority = 1
			ruleSets = [
					"category/java/performance.xml/AvoidArrayLoops",
			]
		}
	}

	spotless {
		// optional: limit format enforcement to just the files changed by this feature branch
		ratchetFrom 'origin/main'

		format 'misc', {
			// define the files to apply `misc` to
			target '*.gradle', '.gitattributes', '.gitignore'

			// define the steps to apply to those files
			trimTrailingWhitespace()
			indentWithTabs() // or spaces. Takes an integer argument if you don't like 4
			endWithNewline()
		}
		java {
			googleJavaFormat()
		}
	}

	test {
		useJUnitPlatform {
			excludeTags "IntegrationTest"
			excludeTags "Probe"
		}

		// Always run tests, even when nothing changed.
		dependsOn 'cleanTest'

		// Show test results.
		testLogging {
			events "passed", "skipped", "failed"
		}
	}

	task preCommit() {
		dependsOn clean, spotlessApply, build
		doLast {
			println 'Pre-commit check Passed!'
		}
	}
}